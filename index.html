<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TKTM Official | Topiku Topimu</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Tailwind v4 CDN with Theme Config -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-brand: #0a0a0a;
            --color-accent: #f59e0b; /* Amber 500 */
            --color-accent-hover: #fbbf24; /* Amber 400 */

            --font-sans: "Plus Jakarta Sans", sans-serif;
            --font-display: "Space Grotesk", sans-serif;

            --radius-4xl: 2.5rem;
            --radius-5xl: 3.5rem;
        }

        @layer base {
            html {
                scroll-behavior: smooth;
                -webkit-tap-highlight-color: transparent;
            }
            body {
                background-color: black;
                color: white;
                font-family: var(--font-sans);
                overflow-x: hidden;
            }
            h1, h2, h3, h4, h5, h6 {
                font-family: var(--font-display);
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Dependencies -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@11/dist/framer-motion.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- App -->
    <script type="text/babel" src="App.jsx"></script>
</body>
</html>
